project:
  name: quickstart
  source_dir: src
  build_dir: /build/quickstart
kgen:
  path: kgen
  build_cmd: cd /build/quickstart && cmake --build .
  run_cmd: cd /build/quickstart && ./simulate
  clean_cmd: ''
  install_cmd: ''
  invocation: auto
build_system:
  type: cmake
  cmake_file: CMakeLists.txt
  target_name: ''
fortran:
  kind_aliases:
    dp: REAL(8)
  compiler: gfortran
  flags: -ffp-contract=off
verification:
  tolerance: 1.0e-14
coverage:
  build_dir: /build/quickstart-coverage
  cases:
    default: cd {build_dir} && ./simulate
translations: {}
