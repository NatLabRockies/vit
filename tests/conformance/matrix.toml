[c_unit_read]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "yes"
integrates = "yes"
semantics = "unreachable"
why = "UNREACHABLE: `unit` is a HANDLE to state outside the signature. It crosses as an int and the file it names does not cross at all -- C++ cannot READ from a Fortran unit. A differential harness is unsound too: the two calls share one file position, so the second reads different data. Translate the variant that takes the data (ROSCO has ParseInput_Int_Opt beside ParseInput_Int), or leave the I/O in Fortran as a boundary."

