# VIT conformance matrix -- generated by tests/test_conformance.py --update
#
# What VIT does with each cell of tests/conformance/conformance.f90.
# `parse` / `c_params` / `bridge` are measured; `why` is written by hand and
# is REQUIRED for any unsupported cell, because an undocumented limit is the
# thing this file exists to prevent.
#
# An unsupported cell is not a failure. A limit nobody knew about is.

[c_alloc_field]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "yes"
integrates = "yes"
semantics = "ok"

[c_alloc_inout]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "yes"
integrates = "yes"
semantics = "ok"
why = "CROSSES AS A FORTRAN 2018 C DESCRIPTOR since rosco-r2 unit #1's second dispatch, and this cell has now been all three things. FIRST it read `compiles = no` from `test_validate.generate_fortran_bridge` while the INTEGRATION wrapper compiled clean and silently dropped the ALLOCATABLE attribute -- a bare pointer plus a by-value extent, so a reallocation could not reach the caller. Measured on ROSCO's AddToList: three appends, the array still the four elements it started with, the values written one past the end of the heap block, no diagnostic at any stage. THEN both generators refused, which was honest and was not the feature. NOW the dummy is declared in the BIND(C) interface exactly as the original declares it (`DIMENSION(:), ALLOCATABLE, INTENT(INOUT)`), no extent parameter is emitted, and the C side receives the caller's own CFI_cdesc_t* -- CFI_deallocate + CFI_allocate through it do what move_alloc does. Both columns compile; ROSCO's AddToList is integrated on this path with a differential harness (43 cases, 0 failed) and a mutation score of 1.000. STILL REFUSED, for being unmeasured rather than impossible: a SCALAR allocatable, rank >= 2, a CHARACTER or derived-type element, and any type/kind the interface cannot declare as the actual's own (LOGICAL, COMPLEX)."

[c_alloc_out]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "yes"
integrates = "yes"
semantics = "ok"
why = "A CAPABILITY GAIN, measured 2026-08-12. This read compiles='no' while the allocate-on-return convention (d4ba20b) covered the C++ direction only and the Fortran reference side of test-validate still passed a plain local to an ALLOCATABLE dummy. It compiles now. SEPARATELY, and unchanged: translation-loop's FEATURE_CELLS maps an ALLOCATABLE INTENT(OUT) dummy to c_alloc_inout, NOT to this cell, so no declaration is ever judged against it. That imprecision is pre-existing and is pinned deliberately in translation-loop tests/test_plan.py so a correction fails loudly; it is recorded here because this cell's value cannot be read as governing anything until it is fixed."

