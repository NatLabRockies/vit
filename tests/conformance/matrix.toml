# VIT conformance matrix -- generated by tests/test_conformance.py --update
#
# What VIT does with each cell of tests/conformance/conformance.f90.
# `parse` / `c_params` / `bridge` are measured; `why` is written by hand and
# is REQUIRED for any unsupported cell, because an undocumented limit is the
# thing this file exists to prevent.
#
# An unsupported cell is not a failure. A limit nobody knew about is.

[c_alloc_field]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "yes"

[c_alloc_inout]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "no"
why = "UNSUPPORTED: as c_alloc_out. INTENT(INOUT) ALLOCATABLE needs an ALLOCATABLE local plus MOVE_ALLOC in and out."

[c_alloc_out]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "no"
why = "UNSUPPORTED: an ALLOCATABLE dummy requires an ALLOCATABLE actual, and the bridge passes a plain local. The allocate-on-return convention (d4ba20b) covers the C++ direction; the Fortran reference side of test-validate does not."

[c_assumed_shape_1d]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "yes"

[c_assumed_shape_2d]
parse = "yes"
c_params = "yes"
bridge = "yes"
compiles = "no"
why = "UNSUPPORTED: a rank-2 assumed-shape dummy is passed as m(1:n_m), a rank-1 section. The C side already emits n_<x>_rows and n_<x>_cols; the bridge must declare the local with both extents."

