semantics = "ok"
why = "UNSUPPORTED: the bridge stages only SCALAR intrinsic INTENT(IN) OPTIONALs, and 'w' is an array. This cell read bridge='yes' until 2026-08-12, and that 'yes' certified a bridge that crossed the array while DROPPING the PRESENT() flag -- the callee could not tell a supplied argument from an absent one. Refusing to generate (300da9c) is the correct behaviour and this 'no' is worth more than the earlier 'yes': an absent OPTIONAL rendering as a present one is the P6 shape exactly. compiles is n/a because a bridge that was never generated was never compiled -- not because no compiler was present, which is the other thing n/a means in this column."

